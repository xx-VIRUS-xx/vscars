# VS Code Copilot Mobile Controller - Nginx Configuration
#
# SETUP:
#   1. Copy this file:  sudo cp nginx.conf /etc/nginx/sites-available/devpilot
#   2. Enable it:       sudo ln -s /etc/nginx/sites-available/devpilot /etc/nginx/sites-enabled/
#   3. Test config:     sudo nginx -t
#   4. Reload:          sudo nginx -s reload
#
# For macOS (Homebrew nginx):
#   1. Copy this file:  cp nginx.conf /opt/homebrew/etc/nginx/servers/devpilot.conf
#   2. Test & reload:   nginx -t && brew services restart nginx
#
# SSL (recommended for production):
#   sudo certbot --nginx -d yourdomain.com

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=api:10m rate=30r/m;

upstream devpilot_backend {
    server 127.0.0.1:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;  # Replace with your domain: server_name devpilot.yourdomain.com;

    # --- Security Headers ---
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self';" always;

    # --- Request Limits ---
    client_max_body_size 10M;
    client_body_timeout 30s;
    client_header_timeout 30s;

    # --- Logging ---
    access_log /var/log/nginx/devpilot_access.log;
    error_log  /var/log/nginx/devpilot_error.log;

    # --- Static Files (served directly by nginx, bypasses Python) ---
    location /static/ {
        alias /Users/xxvirusxx/PY/SideHustle/LLM redefined/static/;
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # --- Favicon ---
    location = /favicon.ico {
        alias /Users/xxvirusxx/PY/SideHustle/LLM redefined/static/favicon.ico;
        expires 30d;
        access_log off;
    }

    # --- Auth endpoints (stricter rate limit) ---
    location ~ ^/api/auth/(login|register) {
        limit_req zone=login burst=3 nodelay;
        limit_req_status 429;

        proxy_pass http://devpilot_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- API endpoints ---
    location /api/ {
        limit_req zone=api burst=10 nodelay;
        limit_req_status 429;

        proxy_pass http://devpilot_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeout for long-running commands
        proxy_read_timeout 300s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
    }

    # --- SPA catch-all (serve index.html for all frontend routes) ---
    location / {
        root /Users/xxvirusxx/PY/SideHustle/LLM redefined/static;
        try_files $uri /index.html;
    }

    # --- Block dotfiles ---
    location ~ /\. {
        deny all;
        return 404;
    }
}

