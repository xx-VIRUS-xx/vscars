# VSCARS — nginx reverse proxy config
# Domain: vscars.latenightstack.com
#
# Setup on EC2 Ubuntu:
#   sudo cp nginx.conf /etc/nginx/sites-available/vscars
#   sudo ln -sf /etc/nginx/sites-available/vscars /etc/nginx/sites-enabled/vscars
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d vscars.latenightstack.com

limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=api:10m   rate=60r/m;

upstream vscars_backend {
    server 127.0.0.1:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name vscars.latenightstack.com;

    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 10M;
    client_body_timeout 60s;

    access_log /var/log/nginx/vscars_access.log;
    error_log  /var/log/nginx/vscars_error.log;

    # Static files — served by nginx directly (no Python overhead)
    location /static/ {
        alias /opt/vscars/static/;
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /favicon.ico {
        alias /opt/vscars/static/favicon.ico;
        expires 30d;
        access_log off;
    }

    # WebSocket relay — must NOT be buffered, long timeout
    location /ws/ {
        proxy_pass http://vscars_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;  # keep CLI agent alive for 1h
        proxy_send_timeout 3600s;
    }

    # Auth endpoints — strict rate limit
    location ~ ^/api/auth/(login|register) {
        limit_req zone=login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://vscars_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # All other API endpoints
    location /api/ {
        limit_req zone=api burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://vscars_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }

    # Everything else — route to FastAPI (handles /app, /setup, /landing, etc.)
    location / {
        proxy_pass http://vscars_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Block dotfiles
    location ~ /\. {
        deny all;
        return 404;
    }
}

